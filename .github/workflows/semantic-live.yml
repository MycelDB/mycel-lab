name: Protected semantic live acceptance

on:
  workflow_dispatch:
    inputs:
      daemon_ref:
        description: Full 40-character Mycel daemon commit SHA
        required: true
        type: string
      daemon_image:
        description: Pullable daemon image pinned with @sha256 digest
        required: true
        type: string
      reason:
        description: Approved release-candidate or scheduled-run reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mycel-reliability-destructive
  cancel-in-progress: false

jobs:
  live-semantic:
    name: Bounded live semantic acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: semantic-live
    steps:
      - name: Check out Mycel Lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: mycel-lab
          persist-credentials: false
      - name: Validate immutable operator inputs
        env:
          DAEMON_REF: ${{ inputs.daemon_ref }}
          DAEMON_IMAGE: ${{ inputs.daemon_image }}
          RUN_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "$DAEMON_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DAEMON_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          [[ -n "$RUN_REASON" ]]
      - name: Check out exact daemon scenario source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MycelDB/mycel
          ref: ${{ inputs.daemon_ref }}
          path: mycel
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: mycel-lab/go.mod
          cache-dependency-path: mycel-lab/go.sum
      - name: Verify exact daemon source and image provenance
        env:
          DAEMON_REF: ${{ inputs.daemon_ref }}
          DAEMON_IMAGE: ${{ inputs.daemon_image }}
        run: |
          set -euo pipefail
          test "$(git -C mycel rev-parse HEAD)" = "$DAEMON_REF"
          test -z "$(git -C mycel status --porcelain)"
          docker pull "$DAEMON_IMAGE"
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$DAEMON_REF"
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{index .Config.Labels "io.myceldb.source.dirty"}}')" = false
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/MycelDB/mycel
      - name: Verify locked live-provider ceilings
        working-directory: mycel-lab
        run: |
          set -euo pipefail
          test "$(sha256sum tests/reliability/provider-profiles/openai-compatible-live.yaml | awk '{print $1}')" = bcd37705b56270fe6d1e040ca489ccd95ef49e88d26ee341eee62537043bf89f
          grep -Fx '  maxRequests: 128' tests/reliability/provider-profiles/openai-compatible-live.yaml
          grep -Fx '  maxInputTokens: 20000' tests/reliability/provider-profiles/openai-compatible-live.yaml
          grep -Fx '    maxEstimatedCostMicros: 1000000' tests/reliability/provider-profiles/openai-compatible-live.yaml
          grep -Fx '  totalTimeout: 5m' tests/reliability/provider-profiles/openai-compatible-live.yaml
      - name: Build exact harness
        working-directory: mycel-lab
        run: go build -trimpath -buildvcs=true -o ./bin/mycel-lab ./cmd/mycel-lab
      - name: Run approved live scenario once
        id: live_run
        working-directory: mycel-lab
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/mycel-lab-semantic-live
          DAEMON_IMAGE: ${{ inputs.daemon_image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          ./bin/mycel-lab run suite semantic-live-provider \
            --confirm-destructive \
            --image "$DAEMON_IMAGE" \
            --provider-profile tests/reliability/provider-profiles/openai-compatible-live.yaml \
            --artifact-root "$ARTIFACT_ROOT"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify artifacts are safe to upload
        id: safety
        if: always()
        working-directory: mycel-lab
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/mycel-lab-semantic-live
        run: |
          if python3 scripts/verifyArtifactSafety.py "$ARTIFACT_ROOT"; then
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload sanitized live evidence
        if: always() && steps.safety.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semantic-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mycel-lab-semantic-live
          if-no-files-found: error
          retention-days: 30
      - name: Enforce live verdict and artifact safety
        if: always()
        env:
          RUN_EXIT_CODE: ${{ steps.live_run.outputs.exit_code }}
          ARTIFACT_SAFE: ${{ steps.safety.outputs.safe }}
        run: |
          test "$RUN_EXIT_CODE" = 0
          test "$ARTIFACT_SAFE" = true
