name: Protected cluster release gate

on:
  workflow_dispatch:
    inputs:
      daemon_ref:
        description: Full 40-character Mycel daemon commit SHA
        required: true
        type: string
      daemon_image:
        description: Pullable daemon image pinned with @sha256 digest
        required: true
        type: string
      reason:
        description: Approved release-gate reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mycel-reliability-destructive
  cancel-in-progress: false

jobs:
  cluster-release-gate:
    name: Exact-candidate cluster release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release-gate
    steps:
      - name: Verify native AMD64 execution host
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
      - name: Check out Mycel Lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: mycel-lab
          persist-credentials: false
      - name: Validate immutable operator inputs
        env:
          DAEMON_REF: ${{ inputs.daemon_ref }}
          DAEMON_IMAGE: ${{ inputs.daemon_image }}
          RUN_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "$DAEMON_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DAEMON_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          [[ -n "$RUN_REASON" ]]
      - name: Check out exact daemon scenario source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MycelDB/mycel
          ref: ${{ inputs.daemon_ref }}
          path: mycel
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: mycel-lab/go.mod
          cache-dependency-path: mycel-lab/go.sum
      - name: Install pinned k3d
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            --output "$RUNNER_TEMP/bin/k3d"
          echo '06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  k3d' \
            | (cd "$RUNNER_TEMP/bin" && sha256sum --check --strict -)
          chmod +x "$RUNNER_TEMP/bin/k3d"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify runner prerequisites and exact candidate
        env:
          DAEMON_REF: ${{ inputs.daemon_ref }}
          DAEMON_IMAGE: ${{ inputs.daemon_image }}
        run: |
          set -euo pipefail
          docker version
          docker compose version
          k3d version
          kubectl version --client=true
          test "$(git -C mycel rev-parse HEAD)" = "$DAEMON_REF"
          test -z "$(git -C mycel status --porcelain)"
          docker pull "$DAEMON_IMAGE"
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$DAEMON_REF"
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{index .Config.Labels "io.myceldb.source.dirty"}}')" = false
          test "$(docker image inspect "$DAEMON_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/MycelDB/mycel
      - name: Verify immutable AMD64 object-store helpers
        env:
          MINIO_IMAGE: docker.io/myceldb/mycel-minio-test-helper@sha256:f33b406adb70891f722e0465ec085056b036f8f5494e4eff33317a9612cf24ff
          MINIO_MC_IMAGE: docker.io/myceldb/mycel-mc-test-helper@sha256:9646d8b5d019fd20e8f4e1d782b29a56581d51c5a367e7c43156c0faac1a69f0
        run: |
          set -euo pipefail
          docker pull "$MINIO_IMAGE"
          docker pull "$MINIO_MC_IMAGE"
          test "$(docker image inspect "$MINIO_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$MINIO_MC_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$MINIO_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = 07c3a429bfed433e49018cb0f78a52145d4bedeb
          test "$(docker image inspect "$MINIO_MC_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = 7394ce0dd2a80935aded936b09fa12cbb3cb8096
          test "$(docker image inspect "$MINIO_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/minio/minio
          test "$(docker image inspect "$MINIO_MC_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/minio/mc
          test "$(docker image inspect "$MINIO_IMAGE" --format '{{index .Config.Labels "io.myceldb.source.dirty"}}')" = false
          test "$(docker image inspect "$MINIO_MC_IMAGE" --format '{{index .Config.Labels "io.myceldb.source.dirty"}}')" = false
          docker run --rm "$MINIO_IMAGE" --version | grep -Fx 'minio version RELEASE.2025-09-07T16-13-09Z (commit-id=07c3a429bfed433e49018cb0f78a52145d4bedeb)'
          docker run --rm "$MINIO_MC_IMAGE" --version | grep -Fx 'mc version RELEASE.2025-08-13T08-35-41Z (commit-id=7394ce0dd2a80935aded936b09fa12cbb3cb8096)'
      - name: Build exact harness
        working-directory: mycel-lab
        run: go build -trimpath -buildvcs=true -o ./bin/mycel-lab ./cmd/mycel-lab
      - name: Run approved cluster release gate once
        id: release_run
        working-directory: mycel-lab
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/mycel-lab-cluster-release-gate
          DAEMON_IMAGE: ${{ inputs.daemon_image }}
          MINIO_IMAGE: docker.io/myceldb/mycel-minio-test-helper@sha256:f33b406adb70891f722e0465ec085056b036f8f5494e4eff33317a9612cf24ff
          MINIO_MC_IMAGE: docker.io/myceldb/mycel-mc-test-helper@sha256:9646d8b5d019fd20e8f4e1d782b29a56581d51c5a367e7c43156c0faac1a69f0
        run: |
          set +e
          ./bin/mycel-lab run suite cluster-release-gate \
            --confirm-destructive \
            --image "$DAEMON_IMAGE" \
            --artifact-root "$ARTIFACT_ROOT"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify artifacts are safe to upload
        id: safety
        if: always()
        working-directory: mycel-lab
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/mycel-lab-cluster-release-gate
        run: |
          if python3 scripts/verifyArtifactSafety.py "$ARTIFACT_ROOT"; then
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload sanitized release-gate evidence
        if: always() && steps.safety.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cluster-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mycel-lab-cluster-release-gate
          if-no-files-found: error
          retention-days: 30
      - name: Enforce release-gate verdict and artifact safety
        if: always()
        env:
          RUN_EXIT_CODE: ${{ steps.release_run.outputs.exit_code }}
          ARTIFACT_SAFE: ${{ steps.safety.outputs.safe }}
        run: |
          test "$RUN_EXIT_CODE" = 0
          test "$ARTIFACT_SAFE" = true
