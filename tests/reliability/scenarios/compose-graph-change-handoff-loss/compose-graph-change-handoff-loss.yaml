apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: compose-graph-change-handoff-loss
  description: Reproduce a committed graph mutation whose node-local notification handoff is lost before restart, while graph truth remains durable.
seed: 4636
providerProfileRef: deterministic-token-basis-v1
environment:
  driver: compose
  namespace: mycel-lab
  options:
    composeFiles:
      - ../mycel/tests/compose/cluster/compose.yml
      - tests/compose/graph-change-outbox-ports.yml
      - tests/compose/semantic-pending-restart.yml
    projectNamePrefix: mycel-lab-graph-change-handoff
    imageOverride: docker.io/myceldb/mycel@sha256:7e43ff6747449bf198f5f0b4e0437ba57de48ec48c5559f0f37bc5151876eb47
    serviceNames: [myceld-a, myceld-b, myceld-c]
    grpcPorts: [19291, 19292, 19293]
  capabilities:
    required: [per-node-endpoints, node-exec, rolling-restart, logs]
clusterRef: raft-3-node
clusterOverrides:
  image: docker.io/myceldb/mycel@sha256:7e43ff6747449bf198f5f0b4e0437ba57de48ec48c5559f0f37bc5151876eb47
  raft:
    partitionCount: 16
actorGroups:
  - name: semantic-controller
    profileRef: semantic-controller
    count: 3
    rate:
      mode: per-actor
      commitsPerSecond: 1
semantic:
  targetActorGroup: semantic-controller
  rule:
    deferProvisioning: true
    key: graph-change-handoff-loss-search
    displayName: Graph-change handoff loss search
    targetLabels: [Document]
    bindingKey: search
    purpose: semantic_search
    sourceMode: self
    includeProperties: [text]
    minimumTextLength: 1
    physicalIndex: exact
    dirtyCooldown: 1ms
    maxBatchSize: 16
    workerConcurrency: 1
  maintenance:
    timeout: 30s
    pollInterval: 100ms
    analyzeLimit: 64
    processLimit: 64
phases:
  - name: establish-ready-semantic-baseline
    duration: 1ms
    events:
      - type: semantic-node-create
        target:
          nodeId: 00000000-0000-4000-8000-000000004636
          labels: [Document]
          text: handoff-baseline
      - type: semantic-rule-create
        target:
          semantic: deferred
      - type: semantic-backfill
        target:
          force: true
          limit: 8
          expectedSelected: 1
          minimumGenerated: 1
      - type: semantic-maintenance-await
        target:
          timeout: 30s
          pollInterval: 100ms
      - type: semantic-reliability-assert
        target:
          requireFreshAtLatest: true
          maximumUnresolvedGapCount: 0
          captureGenerationAs: baseline-generation
      - type: semantic-search-assert
        target:
          query: handoff-baseline
          minimumScore: 0.99
          expectedResultCount: 1
          expectedNodeIds: [00000000-0000-4000-8000-000000004636]
          requireProvenance: true
          expectGenerationFrom: baseline-generation
          captureRecordAs: baseline-record
          captureConfigurationHashAs: baseline-configuration
  - name: make-notification-handoff-unwritable
    duration: 1ms
    events:
      - type: graph-change-notification-fault
        target:
          ordinals: [0, 1, 2]
  - name: commit-without-durable-derived-handoff
    duration: 1ms
    events:
      - type: semantic-node-update
        target:
          nodeId: 00000000-0000-4000-8000-000000004636
          text: handoff-lost
          captureRevisionAs: lost-commit
  - name: restore-notification-path
    duration: 1ms
    events:
      - type: graph-change-notification-restore
        target:
          ordinals: [0, 1, 2]
  - name: restart-and-expose-missing-derived-work
    duration: 1ms
    events:
      - type: rolling-restart
        target:
          scope: cluster
      - type: cluster-recovery-wait
        target:
          timeout: 60s
          interval: 200ms
          commandTimeout: 3s
          sessionInitTimeout: 20s
          minimumStablePolls: 3
          reuseEndpointSessions: true
      # Acceptance invariant: graph truth committed above must yield durable
      # pending work even though the local notification handoff was unavailable.
      # The graph-change journal is the authoritative replay source.
      - type: semantic-work-assert
        target:
          nodeId: 00000000-0000-4000-8000-000000004636
          expectedStatus: pending
          expectedAttemptCount: 0
          expectRevisionFrom: lost-commit
          # Journal replay durably restores the raw dirty event. Materialize
          # the bounded pending-work certificate explicitly while background
          # maintenance remains disabled.
          analyze: true
          expectBackgroundMaintenanceEnabled: false
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: 60s
    healthConvergenceInterval: 2s
    requireSharedClusterIdentity: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
