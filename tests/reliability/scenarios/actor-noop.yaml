apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: actor-noop
  description: No-op actor scenario for scheduler smoke tests.
seed: 2468
environment:
  driver: k3d
  namespace: mycel-lab
clusterRef: raft-3-node
actorGroups:
  - name: noop-users
    profileRef: noop
    count: 3
    rate:
      mode: group-total
      commitsPerSecond: 9
phases:
  - name: base-rate
    duration: 1s
  - name: slower-rate
    duration: 1s
    actorGroupOverrides:
      noop-users:
        rate:
          mode: group-total
          commitsPerSecond: 3
assertions:
  final:
    requireHealthyCluster: false
artifacts:
  collectScenarioSpec: true
