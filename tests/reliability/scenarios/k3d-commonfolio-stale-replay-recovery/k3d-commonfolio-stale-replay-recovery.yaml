apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: k3d-commonfolio-stale-replay-recovery
  description: Deterministic retained-PVC recovery after terminal CommonFolio automation state is replayed from older Raft entries.
seed: 23339139
environment:
  driver: k3d
  namespace: mycel-commonfolio-stale-replay
  options:
    clusterNamePrefix: mlab-cfsr
    createArguments:
      - --agents
      - "3"
      - --timeout
      - 180s
    consolePortBase: 19631
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - node-restart
      - logs
clusterRef: raft-3-node
clusterOverrides:
  image: myceldb/mycel:v0.19.3
  raft:
    partitionCount: 16
    compaction:
      mode: off
actorGroups:
  - name: graph-writers
    profileRef: commonfolio-graph-committer
    count: 3
    rate:
      mode: group-total
      commitsPerSecond: 3
  - name: readers
    profileRef: gql-reader
    count: 3
    target:
      actorGroups:
        - graph-writers
    rate:
      mode: group-total
      queriesPerSecond: 3
phases:
  - name: configure-commonfolio-automation
    duration: 4s
    events:
      - type: commonfolio-automation-seed
        target:
          writerGroup: graph-writers
          limit: 3
          debounce: 1s
  - name: generate-terminal-automation-state
    duration: 30s
    actorGroupOverrides:
      graph-writers:
        rate:
          mode: group-total
          commitsPerSecond: 12
      readers:
        rate:
          mode: group-total
          queriesPerSecond: 6
  - name: prove-terminal-state-before-replay
    duration: 1s
    events:
      - type: commonfolio-automation-await-terminal
        target:
          writerGroup: graph-writers
          limit: 3
          minimumPerAssignment: 1
          runLimit: 100
          timeout: 3m
          interval: 2s
  - name: retained-pvc-ordinal-recovery
    duration: 2s
    events:
      - type: node-restart
        target:
          ordinalSequence: [0, 1]
        repeat: 2
        interval: 2s
    outcome:
      availability: expected-degradation
  - name: wait-for-complete-cluster-recovery
    duration: 1s
    events:
      - type: cluster-recovery-wait
        target:
          ordinals: [0, 1, 2]
          expectedGroups: 17
          timeout: 15m
          interval: 5s
    outcome:
      availability: expected-degradation
  - name: post-recovery-workload
    duration: 20s
    actorGroupOverrides:
      graph-writers:
        rate:
          mode: group-total
          commitsPerSecond: 9
      readers:
        rate:
          mode: group-total
          queriesPerSecond: 6
    assertions:
      requireConvergedCounts: true
  - name: collect-recovery-diagnostics
    duration: 2s
    events:
      - type: commonfolio-automation-diagnostics
        target:
          writerGroup: graph-writers
          limit: 3
          runLimit: 100
      - type: log-assert-absent
        target:
          selector: app=myceld
          tail: 5000
          patterns:
            - stale automation invocation update
            - 'handler=graph: graph conflict'
            - restore raft snapshot and replay committed entries
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: 15m
    healthConvergenceInterval: 5s
    requireSharedClusterIdentity: true
    requireConvergedCounts: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
  collectKubernetesState: true
