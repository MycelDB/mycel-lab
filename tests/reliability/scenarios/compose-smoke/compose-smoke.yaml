apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: compose-smoke
  description: Compose-backed smoke scenario for environment driver validation.
seed: 97531
environment:
  driver: compose
  namespace: mycel-lab
  options:
    composeFiles:
      - ../mycel/tests/compose/cluster/compose.yml
      - tests/compose/ports.yml
    projectNamePrefix: mycel-lab
    serviceNames:
      - myceld-a
      - myceld-b
      - myceld-c
    grpcPorts:
      - 19091
      - 19092
      - 19093
    objectStoreFixture: minio
  capabilities:
    required:
      - per-node-endpoints
      - node-restart
      - rolling-restart
      - logs
      - object-store-fixture
clusterRef: raft-3-node
actorGroups:
  - name: noop-users
    profileRef: noop
    count: 3
    rate:
      mode: group-total
      commitsPerSecond: 3
phases:
  - name: smoke
    duration: 1s
assertions:
  final:
    requireHealthyCluster: false
artifacts:
  collectScenarioSpec: true
