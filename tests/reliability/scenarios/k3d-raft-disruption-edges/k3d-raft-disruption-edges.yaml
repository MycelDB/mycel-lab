apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: k3d-raft-disruption-edges
  description: k3d edge-heavy graph workload under rolling restart pressure.
seed: 21212
environment:
  driver: k3d
  namespace: mycel-lab
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - rolling-restart
      - logs
clusterRef: raft-3-node
actorGroups:
  - name: graph-writers
    profileRef: graph-committer
    count: 2
    rate:
      mode: group-total
      commitsPerSecond: 20
  - name: readers
    profileRef: gql-reader
    count: 2
    target:
      actorGroups:
        - graph-writers
    rate:
      mode: group-total
      queriesPerSecond: 4
phases:
  - name: warmup
    duration: 2s
  - name: rolling-restart
    duration: 2s
    events:
      - type: rolling-restart
        target:
          scope: cluster
    outcome:
      availability: expected-degradation
  - name: recovery
    duration: 2s
    assertions:
      requireConvergedCounts: true
assertions:
  final:
    requireHealthyCluster: true
    requireSharedClusterIdentity: true
    requireConvergedCounts: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
  collectKubernetesState: true
