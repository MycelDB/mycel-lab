apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: k3d-raft-disruption-smoke
  description: k3d raft smoke workload with one logical node restart.
seed: 19191
environment:
  driver: k3d
  namespace: mycel-lab
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - node-restart
      - logs
clusterRef: raft-3-node
actorGroups:
  - name: graph-writers
    profileRef: graph-committer
    count: 1
    rate:
      mode: group-total
      commitsPerSecond: 5
phases:
  - name: warmup
    duration: 2s
  - name: restart-node-0
    duration: 2s
    events:
      - type: node-restart
        target:
          ordinal: 0
    outcome:
      availability: expected-degradation
  - name: recovery
    duration: 2s
    assertions:
      requireConvergedCounts: true
assertions:
  final:
    requireHealthyCluster: true
    requireSharedClusterIdentity: true
    requireConvergedCounts: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
  collectKubernetesState: true
