apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: k3d-raft-restart-hard-soak-harness
  description: Transitional Mycel Lab wrapper for the one-hour hard raft restart soak harness.
seed: 26262
environment:
  driver: dry-run
clusterRef: single-node
actorGroups:
  - name: harness
    profileRef: noop
    count: 1
    rate:
      mode: group-total
      commitsPerSecond: 1
phases:
  - name: run-k3d-raft-restart-hard-soak
    duration: 1s
    events:
      - type: host-command
        target:
          workingDirectory: ../mycel
          command:
            - go
            - run
            - ./cmd/mycel-raft-disrupttest
            - --driver
            - k3s
            - --provisioner
            - k3d
            - --profile
            - restart-soak-hard-1h
            - --workload
            - multi-space
            - --image
            - myceldb/mycel:raft-disrupt-local
            - --confirm-destructive
assertions:
  final:
    requireHealthyCluster: false
artifacts:
  collectScenarioSpec: true
