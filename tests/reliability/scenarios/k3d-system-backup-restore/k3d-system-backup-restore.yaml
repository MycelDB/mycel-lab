apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: k3d-system-backup-restore
  description: Native k3d repository-backed full-system backup, fresh-PVC restore, and restored workload verification.
seed: 29292
environment:
  driver: k3d
  namespace: mycel-system-backup-restore
  options:
    clusterNamePrefix: mlab-sbr
    digestPinnedImagePolicy: node-pull
    objectStoreFixture: minio
    createArguments:
      - --agents
      - "3"
      - --timeout
      - 180s
    consolePortBase: 19191
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - logs
      - object-store-fixture
      - volume-replacement
clusterRef: raft-3-node
actorGroups:
  - name: system-backup-writers
    profileRef: graph-committer
    count: 1
    rate:
      mode: group-total
      commitsPerSecond: 0.0001
phases:
  - name: create-workload-fixture
    duration: 1s
    events:
      - type: system-backup-fixture
        target:
          actorId: system-backup-writers-0
          label: nt3-system-backup-fixture
          blobPayload: mycel-lab nt3 system backup restore blob payload
          ordinal: 0
  - name: configure-minio-repository
    duration: 1s
    events:
      - type: cluster-backup-repository-create
        target:
          repositoryId: mycel-lab-system-minio
          bucket: mycel-system-backups
          prefix: mycel-lab/{runID}
          endpoint: http://minio:9000
          region: us-east-1
          forcePathStyle: true
          disableTLS: true
          devOnly: true
  - name: capture-and-validate-backup
    duration: 1s
    events:
      - type: cluster-backup-create
        target:
          repositoryId: mycel-lab-system-minio
          archiveFormat: tar
          captureProvider: filesystem_immutable_copy
          quiesceReadProfile: control_only
          reason: native mycel-lab k3d repository system backup restore test
          convergenceTimeout: 10m
          waitTimeout: 15m
          idempotencyKey: k3d-system-repository-backup-v1
      - type: cluster-backup-validate
        target:
          repositoryId: mycel-lab-system-minio
          expectValid: true
  - name: restore-into-fresh-pvcs
    duration: 1s
    events:
      - type: cluster-restore-apply
        target:
          statefulSet: myceld
          bucket: mycel-system-backups
          endpoint: http://minio:9000
          region: us-east-1
          helperRetries: 1
  - name: verify-restored-cluster
    duration: 1s
    events:
      - type: cluster-restore-verify
        target:
          actorId: system-backup-writers-0
          verifyTimeout: 5m
          verifyInterval: 5s
          execTimeout: 30s
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: 10m
    healthConvergenceInterval: 5s
    allowDegradedHealthWarningContains:
      - "restored derived subsystems are not ready:"
    requireSharedClusterIdentity: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
