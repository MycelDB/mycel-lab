apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: compose-semantic-openai-emulator
  description: Credential-free OpenAI-compatible embedding protocol emulator acceptance for semantic graph indexing.
seed: 4612
providerProfileRef: openai-compatible-emulator
environment:
  driver: compose
  namespace: mycel-lab
  options:
    composeFiles:
      - ../mycel/tests/compose/cluster/compose.yml
      - tests/compose/semantic-protocol-ports.yml
    projectNamePrefix: mycel-lab-semantic-protocol
    imageOverride: docker.io/myceldb/mycel@sha256:0973cddd9c282abff40d8edeb2e8f7a801e58d40bfbab4c8507ce2d9daae2dd7
    providerEmulatorImage: local/mycel-provider-emulator:dev
    serviceNames:
      - myceld-a
      - myceld-b
      - myceld-c
    grpcPorts:
      - 19791
      - 19792
      - 19793
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - logs
      - provider-emulator
clusterRef: raft-3-node
clusterOverrides:
  image: docker.io/myceldb/mycel@sha256:0973cddd9c282abff40d8edeb2e8f7a801e58d40bfbab4c8507ce2d9daae2dd7
actorGroups:
  - name: semantic-controller
    profileRef: semantic-controller
    count: 1
    rate:
      mode: per-actor
      commitsPerSecond: 1
  - name: semantic-outsider
    profileRef: gql-reader
    count: 1
    target:
      actorGroups:
        - semantic-controller
    rate:
      mode: per-actor
      queriesPerSecond: 1
semantic:
  targetActorGroup: semantic-controller
  rule:
    deferProvisioning: true
    key: openai-emulator-document-search
    displayName: OpenAI emulator document search
    description: Run-scoped semantic rule proving OpenAI-compatible embedding protocol behavior through the local emulator.
    targetLabels: [Document]
    bindingKey: search
    purpose: semantic_search
    sourceMode: self
    includeProperties: [text]
    minimumTextLength: 1
    physicalIndex: exact
    dirtyCooldown: 1ms
    maxBatchSize: 1
    workerConcurrency: 1
  maintenance:
    timeout: 45s
    pollInterval: 150ms
    analyzeLimit: 16
    processLimit: 16
phases:
  - name: seed-protocol-corpus
    duration: 1ms
    events:
      - type: semantic-node-create
        target:
          nodeId: 00000000-0000-4000-8000-000000004601
          labels: [Document]
          text: Emulator protocol fixture about caring for a sick cat with hydration and veterinary guidance.
      - type: semantic-node-create
        target:
          nodeId: 00000000-0000-4000-8000-000000004602
          labels: [Document]
          text: Emulator protocol fixture about quantum particles, detector calibration, and high energy physics.
      - type: semantic-node-create
        target:
          nodeId: 00000000-0000-4000-8000-000000004603
          labels: [Document]
          text: Emulator protocol fixture about handmade pasta, basil, tomatoes, and olive oil.
  - name: embed-with-openai-compatible-emulator
    duration: 1ms
    events:
      - type: semantic-rule-create
        target:
          semantic: deferred
      - type: semantic-backfill
        target:
          force: true
          limit: 8
          expectedSelected: 3
          minimumGenerated: 3
      - type: semantic-maintenance-await
        target:
          timeout: 45s
          pollInterval: 150ms
      - type: semantic-reliability-assert
        target:
          requireFreshAtLatest: true
          maximumUnresolvedGapCount: 0
          minimumSemanticGeneration: 1
          captureGenerationAs: protocol-generation-v1
      - type: semantic-provider-emulator-assert
        target:
          minimumRequests: 3
          maximumRequests: 16
          requireSingleItem: true
          maximumBatchItems: 1
          maximumAttemptsPerInput: 2
          authorization: absent
          expectedModels: [embedding-v1]
          minimumOutcomes: {success: 3}
          minimumStatuses: {"200": 3}
  - name: prove-search-and-provider-accounting
    duration: 1ms
    events:
      - type: semantic-search-assert
        target:
          query: Emulator protocol fixture about caring for a sick cat with hydration and veterinary guidance.
          limit: 1
          expectedResultCount: 1
          requireProvenance: true
          requireActualRoute: false
          expectGenerationFrom: protocol-generation-v1
          expectedNodeIds:
            - 00000000-0000-4000-8000-000000004601
      - type: semantic-unauthorized-search
        target:
          actorGroup: semantic-outsider
      - type: semantic-provider-emulator-assert
        target:
          minimumRequests: 4
          maximumRequests: 24
          requireSingleItem: true
          maximumBatchItems: 1
          maximumAttemptsPerInput: 2
          authorization: absent
          expectedModels: [embedding-v1]
          minimumOutcomes: {success: 4}
          minimumStatuses: {"200": 4}
  - name: update-lifecycle-and-final-protocol-proof
    duration: 1ms
    events:
      - type: semantic-node-update
        target:
          nodeId: 00000000-0000-4000-8000-000000004601
          text: Updated emulator protocol fixture about sick cat care, hydration checks, warning signs, and veterinarian follow-up.
          captureRevisionAs: protocol-update-revision
      - type: semantic-maintenance-await
        target:
          timeout: 45s
          pollInterval: 150ms
      - type: semantic-reliability-assert
        target:
          requireFreshAtLatest: true
          maximumUnresolvedGapCount: 0
      - type: semantic-search-assert
        target:
          query: Updated emulator protocol fixture about sick cat care, hydration checks, warning signs, and veterinarian follow-up.
          limit: 1
          expectedResultCount: 1
          requireProvenance: true
          requireActualRoute: false
          expectSourceRevisionFrom: protocol-update-revision
          expectGenerationFrom: protocol-generation-v1
          expectedNodeIds:
            - 00000000-0000-4000-8000-000000004601
      - type: semantic-provider-emulator-assert
        target:
          minimumRequests: 6
          maximumRequests: 32
          requireSingleItem: true
          maximumBatchItems: 1
          maximumAttemptsPerInput: 2
          authorization: absent
          expectedModels: [embedding-v1]
          minimumOutcomes: {success: 6}
          minimumStatuses: {"200": 6}
          minimumResponseModels: {embedding-v1: 6}
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: 60s
    healthConvergenceInterval: 2s
    requireSharedClusterIdentity: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
