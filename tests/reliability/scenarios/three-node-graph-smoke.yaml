apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: three-node-graph-smoke
  description: Three-node graph transaction smoke scenario.
seed: 9090
environment:
  driver: k3d
  namespace: mycel-lab
clusterRef: raft-3-node
actorGroups:
  - name: graph-writers
    profileRef: graph-committer
    count: 2
    rate:
      mode: group-total
      commitsPerSecond: 20
  - name: readers
    profileRef: gql-reader
    count: 1
    target:
      actorGroups:
        - graph-writers
    rate:
      mode: group-total
      queriesPerSecond: 5
phases:
  - name: smoke
    duration: 1s
assertions:
  final:
    requireHealthyCluster: true
    requireConvergedCounts: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
