apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: compose-issue313-journal-import
  description: Reproduce the Commonfolio journal-entry/page-link import shape with one importer and one atomic graph transaction at a time.
seed: 313314
environment:
  driver: compose
  namespace: mycel-issue313-journal-import
  options:
    composeFiles:
      - ../mycel/tests/compose/cluster/compose.yml
      - tests/compose/issue313-ports.yml
    projectNamePrefix: mycel-issue313-journal-import
    serviceNames:
      - myceld-a
      - myceld-b
      - myceld-c
    grpcPorts:
      - 19315
      - 19316
      - 19317
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - logs
clusterRef: raft-3-node
clusterOverrides:
  raft:
    partitionCount: 16
  env:
    MYCELD_GRAPH_WRITE_TRACE: "true"
    MYCELD_GRAPH_WRITE_TRACE_THRESHOLD: "0"
actorGroups:
  - name: commonfolio-importer
    profileRef: issue313-journal-import
    count: 1
    rate:
      mode: group-total
      commitsPerSecond: 0.2
phases:
  - name: bootstrap
    duration: 10s
  - name: import-stress
    duration: 50s
  - name: settle
    duration: 10s
    assertions:
      requireConvergedCounts: false
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: 90s
    healthConvergenceInterval: 2s
    requireSharedClusterIdentity: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
