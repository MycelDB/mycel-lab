apiVersion: "myceldb.io/reliability/v1"
kind: "Scenario"
metadata:
  name: "compose-semantic-out-of-order"
  description: "Generated controlled semantic provider correctness case; requires fresh runtime qualification."
seed: 4660
providerProfileRef: "semantic-out-of-order"
environment:
  driver: "compose"
  namespace: "mycel-lab"
  options:
    composeFiles:
      - "../mycel/tests/compose/cluster/compose.yml"
      - "tests/compose/ports.yml"
      - "tests/compose/semantic-pending-restart.yml"
    projectNamePrefix: "mycel-lab-semantic-out-of-order"
    imageOverride: "docker.io/myceldb/mycel@sha256:0973cddd9c282abff40d8edeb2e8f7a801e58d40bfbab4c8507ce2d9daae2dd7"
    providerEmulatorImage: "local/mycel-provider-emulator:dev"
    serviceNames:
      - "myceld-a"
      - "myceld-b"
      - "myceld-c"
    grpcPorts:
      - 19091
      - 19092
      - 19093
  capabilities:
    required:
      - "per-node-endpoints"
      - "node-exec"
      - "rolling-restart"
      - "logs"
clusterRef: "raft-3-node"
clusterOverrides:
  image: "docker.io/myceldb/mycel@sha256:0973cddd9c282abff40d8edeb2e8f7a801e58d40bfbab4c8507ce2d9daae2dd7"
  raft:
    partitionCount: 16
actorGroups:
  -
    name: "semantic-controller"
    profileRef: "semantic-controller"
    count: 3
    rate:
      mode: "per-actor"
      commitsPerSecond: 1
semantic:
  targetActorGroup: "semantic-controller"
  rule:
    deferProvisioning: true
    key: "compose-semantic-out-of-order"
    targetLabels:
      - "Document"
    bindingKey: "search"
    sourceMode: "self"
    includeProperties:
      - "text"
    minimumTextLength: 1
    physicalIndex: "exact"
    dirtyCooldown: "1ms"
    maxBatchSize: 16
    workerConcurrency: 1
  maintenance:
    timeout: "30s"
    pollInterval: "100ms"
    analyzeLimit: 64
    processLimit: 64
phases:
  -
    name: "establish-certified-old-revision"
    duration: "1ms"
    events:
      -
        type: "semantic-node-create"
        target:
          nodeId: "00000000-0000-4000-8000-000000004660"
          labels:
            - "Document"
          text: "axis-0"
          captureRevisionAs: "older-commit"
      -
        type: "semantic-rule-create"
        target:
          semantic: "deferred"
      -
        type: "semantic-backfill"
        target:
          force: true
          limit: 1
          expectedSelected: 1
          minimumGenerated: 1
      -
        type: "semantic-maintenance-await"
        target:
          timeout: "30s"
          pollInterval: "100ms"
      -
        type: "semantic-search-assert"
        target:
          query: "axis-0"
          minimumScore: 0.99
          expectedResultCount: 1
          expectedNodeIds:
            - "00000000-0000-4000-8000-000000004660"
          requireProvenance: true
          expectSourceRevisionFrom: "older-commit"
          timeout: "30s"
          pollInterval: "100ms"
  -
    name: "newer-publication-before-older-completion"
    duration: "1ms"
    events:
      -
        type: "semantic-ordering-assert"
        target:
          nodeId: "00000000-0000-4000-8000-000000004660"
          gate: "older-response"
          text: "axis-2"
          expectRevisionFrom: "older-commit"
          captureRevisionAs: "newer-commit"
          captureRecordAs: "newer-before-release"
          timeout: "30s"
          pollInterval: "100ms"
  -
    name: "reject-stale-vector-and-reconcile-real-completions"
    duration: "1ms"
    events:
      -
        type: "semantic-search-assert"
        target:
          query: "axis-0"
          minimumScore: 0.99
          expectedResultCount: 0
          forbiddenNodeIds:
            - "00000000-0000-4000-8000-000000004660"
      -
        type: "semantic-reliability-assert"
        target:
          requireFreshAtLatest: true
          maximumUnresolvedGapCount: 0
          expectFreshRevisionFrom: "newer-commit"
      -
        type: "semantic-provider-emulator-assert"
        target:
          minimumRequests: 7
          maximumRequests: 7
          maximumAttemptsPerInput: 2
          requireSingleItem: true
          authorization: "absent"
          expectedModels:
            - "embedding-v1"
          expectedOutcomes:
            success: 7
          expectedStatuses:
            "200": 7
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: "60s"
    healthConvergenceInterval: "2s"
    requireSharedClusterIdentity: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
