apiVersion: myceldb.io/reliability/v1
kind: Scenario
metadata:
  name: k3d-cluster-validation
  description: k3d cluster identity, graph data-plane, and rolling restart validation.
seed: 18181
environment:
  driver: k3d
  namespace: mycel-lab
  options:
    clusterNamePrefix: mycel-lab
  capabilities:
    required:
      - per-node-endpoints
      - node-exec
      - rolling-restart
      - logs
clusterRef: raft-3-node
actorGroups:
  - name: graph-writers
    profileRef: graph-committer
    count: 3
    rate:
      mode: group-total
      commitsPerSecond: 12
  - name: readers
    profileRef: gql-reader
    count: 3
    target:
      actorGroups:
        - graph-writers
    rate:
      mode: group-total
      queriesPerSecond: 6
phases:
  - name: bootstrap-and-write
    duration: 2s
  - name: rolling-restart
    duration: 1s
    events:
      - type: rolling-restart
        target:
          scope: cluster
    outcome:
      availability: expected-degradation
  - name: post-restart-validation
    duration: 2s
    assertions:
      requireConvergedCounts: true
assertions:
  final:
    requireHealthyCluster: true
    healthConvergenceTimeout: 60s
    healthConvergenceInterval: 2s
    requireSharedClusterIdentity: true
    requireConvergedCounts: true
    requireNoAcknowledgedGraphTransactionLoss: true
artifacts:
  collectScenarioSpec: true
  collectActorEvents: true
  collectReadChecks: true
  collectKubernetesState: true
