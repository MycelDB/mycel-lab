apiVersion: myceldb.io/reliability/v1
kind: ClusterProfile
metadata:
  name: raft-3-node
  description: Three-node raft cluster for reliability smoke scenarios.
cluster:
  nodes: 3
  image: myceldb/mycel:latest
  raft:
    nodeCount: 3
    partitionCount: 64
    replicaFactor: 3
    localNodeIDMode: ordinal
    electionTick: 25
    heartbeatTick: 1
    sendTimeout: 500ms
    compaction:
      mode: off
      snapshotEntries: 0
      snapshotInterval: 0
      snapshotMaxLogBytes: 0
      snapshotMinRetainEntries: 0
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  storage:
    size: "10Gi"
    className: local-path
